<!doctype html>

<meta name="color-scheme" content="dark light">

<link rel="alternate icon" href="WhatsMyPC.ico">
<link rel="stylesheet" href="app.css">
<script>
  // Apply theme before first paint to avoid a flash
  try {
    const g = k => JSON.parse(localStorage.getItem('wmpc.' + k));
    const m = g('theme') || 'dark';
    const t = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
    document.documentElement.dataset.theme = t;
    const a = g('accent'); if (a) document.documentElement.style.setProperty('--accent', a);
    if (g('compact') === true) document.documentElement.classList.add('compact');
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>

<div id="app">
  <aside id="side" aria-label="Main navigation">
    <a class="brand" href="#/overview">
      <img src="logo.svg" alt="" width="26" height="26">
      <span>WhatsMyPC</span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot">
      <div class="mini"><span>CPU</span><div class="mbar"><i id="sfCpu"></i></div><b id="sfCpuV">–</b></div>
      <div class="mini"><span>RAM</span><div class="mbar"><i id="sfRam"></i></div><b id="sfRamV">–</b></div>
    </div>
  </aside>
  <div id="main">
    <header id="top">
      <button class="ib" id="bSide" aria-label="Toggle sidebar" title="Toggle sidebar"><svg><use href="#i-sidebar"/></svg></button>
      <div class="crumbs"><span id="crumbGroup"></span><svg class="chev"><use href="#i-chev"/></svg><b id="crumbTitle"></b></div>
      <button class="cmdk" id="bCmd" aria-label="Search and commands">
        <svg><use href="#i-search"/></svg><span>Search pages &amp; actions…</span><kbd>Ctrl K</kbd>
      </button>
      <div class="top-actions">
        <a class="health" id="health" href="#/overview" title="System health"><i></i><span>…</span></a>
        <button class="ib" id="bSpecs" title="Copy specs (Ctrl+C)" aria-label="Copy specs"><svg><use href="#i-copy"/></svg></button>
        <button class="ib" id="bShot" title="Screenshot (Ctrl+S)" aria-label="Screenshot"><svg><use href="#i-camera"/></svg></button>
        <button class="ib" id="bOverlay" title="Gaming overlay (Ctrl+O)" aria-label="Gaming overlay"><svg><use href="#i-gamepad"/></svg></button>
        <button class="ib" id="bTheme" title="Toggle theme" aria-label="Toggle theme"><svg><use href="#i-moon"/></svg></button>
      </div>
    </header>
    <div id="offline" class="offline" hidden>Lost connection to the WhatsMyPC service. Retrying…</div>
    <main id="page" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<script src="app.js"></script>
</body>
</html>
